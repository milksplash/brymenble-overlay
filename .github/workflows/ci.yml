name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on version tags and PRs; single version on plain pushes.
        python-version: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request') && fromJSON('["3.10","3.11","3.12","3.13"]') || fromJSON('["3.13"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay
      # The overlay depends on the brymenble SDK (same-org sibling repo).
      # Adjust `repository` if the SDK lives elsewhere.
      - name: Checkout SDK (same-org sibling repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/brymenble
          path: brymenble
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./brymenble
          pip install pytest
      - name: Validate skins
        run: |
          cd overlay
          python tools/check_skin.py
      - name: Run tests
        run: |
          cd overlay
          python -m pytest -q
