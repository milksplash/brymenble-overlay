<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BM78xBT Display Overlay</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    /* Scale the meter to the Browser Source / display width, preserving the
       skin's aspect ratio (via its viewBox) and keeping the overlay pixel-
       perfect for OBS at any canvas resolution. */
    #meter {
      display: block;
      width: 100vw;
      height: auto;
    }
  </style>
</head>
<body>
  <svg id="meter" xmlns="http://www.w3.org/2000/svg" style="visibility:hidden"></svg>
  <script src="overlay.js"></script>
</body>
</html>
