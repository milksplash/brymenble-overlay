[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brymenble-overlay"
version = "0.1.1"
description = "BM78xBT multimeter LCD emulation overlay for OBS, driven live by the brymenble SDK over BLE"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Martin Chan" },
]
dependencies = [
    "brymenble>=0.5.2",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/milksplash/brymenble-overlay"
Repository = "https://github.com/milksplash/brymenble-overlay"
Issues = "https://github.com/milksplash/brymenble-overlay/issues"

[tool.setuptools.packages.find]
include = ["overlay*"]
